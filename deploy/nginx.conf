# 生产 Nginx：HTTPS 终止 + WSS 反代 + SPA 静态资源。
#
# 三个容易踩的点（都写进注释，避免以后改配置时踩回去）：
#  1. WebSocket 反代必须关缓冲（proxy_buffering off）并把读超时调大——
#     我们的心跳是 30s，若沿用默认 60s 读超时，网络抖一下就会被反代单方面断开；
#  2. /ws 的 Upgrade/Connection 头必须显式透传，否则握手直接 400；
#  3. SPA 必须 try_files 回退到 index.html，否则刷新子路径会 404。
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # 大文件（前端 JS/CSS）压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    log_format main '$remote_addr - $status $request_time "$request"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Docker 内嵌 DNS：让 upstream 名字在容器重建后也能解析（否则 Nginx 启动时解析一次就缓存住了）
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 生产必须全站 HTTPS：getUserMedia / getDisplayMedia 在非 localhost 下强制要求安全上下文
    server {
        listen 80;
        server_name _;

        # certbot webroot 续期
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /healthz-nginx {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # 证书：由宿主机签发后放进 deploy/certs 并挂载进来
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1h;

        # 安全响应头（摄像头/麦克风权限显式放行给同源）
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;

        # ---- 信令 WebSocket ----
        location /ws {
            set $api http://api:8080;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 关键：长连接不能被反代单方面掐断
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # ---- HTTP API：令牌 / ICE 配置 / GraphQL / 健康检查 ----
        location ~ ^/(token|ice|graphql|healthz)$ {
            set $api http://api:8080;
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- SPA ----
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 带 hash 的构建产物可以长缓存
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
